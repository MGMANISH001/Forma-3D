<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Configure your product in real-time 3D — colors, materials and finishes with live pricing.">
  <title>3D Configurator — FORMA3D</title>
  <meta name="theme-color" content="#FAF7F2">
  <script>/* apply saved theme before first paint (no flash) */(function(){var t;try{t=localStorage.getItem('forma3d_theme');}catch(e){}if(t!=='dark'&&t!=='light'){t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🧊</text></svg>">
</head>
<body class="page-configurator">
  <div data-header></div>

  <main class="configurator">
    <!-- ============ 3D STAGE ============ -->
    <section class="stage-wrap" aria-label="3D preview">
      <div class="stage" id="stage">
        <canvas id="stage-canvas"></canvas>
        <div class="stage-loader" id="stage-loader">
          <div class="spinner"></div>
          <p>Loading 3D model…</p>
        </div>
        <div class="stage-actions">
          <button class="chip" id="btn-spin" type="button" aria-pressed="false" title="Toggle turntable">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>
            360°
          </button>
          <button class="chip" id="btn-reset" type="button" title="Reset camera">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 3 3 9 9 9"/></svg>
            Reset
          </button>
        </div>
        <div class="view-dock" id="view-dock" role="group" aria-label="Camera views">
          <button class="view-chip active" type="button" data-view="hero" aria-pressed="true">¾ View</button>
          <button class="view-chip" type="button" data-view="front" aria-pressed="false">Front</button>
          <button class="view-chip" type="button" data-view="side" aria-pressed="false">Side</button>
          <button class="view-chip" type="button" data-view="top" aria-pressed="false">Top</button>
        </div>
        <p class="stage-hint">Drag to rotate · Pinch or scroll to zoom</p>
      </div>
    </section>

    <!-- ============ OPTIONS PANEL ============ -->
    <aside class="panel" id="panel" aria-label="Product options">
      <div class="panel-scroll" id="panel-scroll">
        <!-- filled by configurator.js -->
      </div>

      <div class="panel-footer" id="panel-footer">
        <!-- breakdown + add-to-cart (desktop) — filled by configurator.js -->
      </div>
    </aside>

    <!-- ============ STICKY BUY BAR (mobile) ============ -->
    <div class="buy-bar" id="buy-bar" hidden>
      <div class="buy-bar-price">
        <span class="buy-bar-label">Total</span>
        <strong id="buy-bar-total">$0</strong>
      </div>
      <button class="btn btn-primary" id="buy-bar-add" type="button">Add to cart</button>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/vendor/three.min.js"></script>
  <script src="/vendor/OrbitControls.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/models.js"></script>
  <script src="/js/configurator.js"></script>
</body>
</html>
