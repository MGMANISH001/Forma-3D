<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Order confirmation.">
  <title>Order confirmed — FORMA3D</title>
  <meta name="theme-color" content="#FAF7F2">
  <script>/* apply saved theme before first paint (no flash) */(function(){var t;try{t=localStorage.getItem('forma3d_theme');}catch(e){}if(t!=='dark'&&t!=='light'){t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🧊</text></svg>">
</head>
<body>
  <div data-header></div>

  <main class="success container">
    <div class="success-card" id="success-card">
      <div class="success-icon" id="success-icon">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h1 id="success-title">Order confirmed</h1>
      <p class="success-sub" id="success-sub">Fetching your order…</p>
      <div id="success-body"><!-- filled by success.js --></div>
      <a class="btn btn-primary" href="/">Back to the collection</a>
    </div>
  </main>

  <div data-footer></div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/success.js"></script>
</body>
</html>
